[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-medical-history-assistant"
version = "0.7.0"
description = "LOVISA: Medical History & Clinical Reasoning Assistant with local inference and human review"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "third_party/CT-MIT-LICENSE.txt"]
dependencies = [
  "langgraph>=1.0,<2",
  "langchain-core>=1.4,<2",
  "pydantic>=2.10,<3",
  "httpx>=0.27,<1",
  "streamlit>=1.65,<2",
  "numpy>=2,<3",
  "pillow>=10,<14",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["medical_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
medical_assistant = ["ui/*.css"]
