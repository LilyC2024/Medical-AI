<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description"><title id="title">LOVISA — three local projects, one human-reviewed report</title><desc id="description">Fictional JSON history passes Python safety checks, human assessment when required, deterministic history and medication extraction and local Ollama reasoning. Separately, CT and endoscopy models produce candidate evidence for explicit human image acceptance. Python combines the verified evidence into a concise draft. A clinician must approve before final export. No image pixels or notes enter the language model.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8097a5"/></marker></defs><g font-family="DejaVu Sans,sans-serif"><rect width="1280" height="760" fill="#f5f8fa"/>
