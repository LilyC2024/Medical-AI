name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      LANGCHAIN_TRACING_V2: 'false'
      LANGCHAIN_TRACING: 'false'
      LANGSMITH_TRACING: 'false'
      OLLAMA_NO_CLOUD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q medical_assistant app.py scripts tests
      - name: Check documentation links
        run: |
          python scripts/check_docs.py
          python scripts/generate_api_docs.py --check
      - name: Install pinned quality tools
        run: python -m pip install ruff==0.17.2 mypy==2.4.0 pytest-cov==7.1.0
      - name: Lint (syntax errors and undefined names)
        run: python -m ruff check .
      - name: Type-check schemas, safety and orchestration
        run: python -m mypy
      - name: Run offline regression tests with coverage floor
        run: python -m pytest -q --cov --cov-report=term
      # Deliberately no Ollama download, hosted model call, record upload,
      # live-model smoke test, report artifact upload, or deployment in CI.

  ct-workbench:
    name: Synthetic CT producer-consumer smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OLLAMA_NO_CLOUD: '1'
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
    steps:
      - name: Check out LOVISA
        uses: actions/checkout@v7
      - name: Check out the matching CT producer
        uses: actions/checkout@v7
        with:
          repository: LilyC2024/ai-medimg-2.5D-CT
          ref: 6b2c7434bef256cd01a2322fb785d49eb4b80ad2
          path: companion-ct
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the separate environments
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock.txt
          python -m venv companion-ct/.venv
          companion-ct/.venv/bin/python -m pip install torch==2.14.1+cpu torchvision==0.29.1+cpu --index-url https://download.pytorch.org/whl/cpu
          companion-ct/.venv/bin/python -m pip install -e './companion-ct[ml,lung,dev]'
      - name: Check shared contract equality
        run: .venv/bin/python scripts/sync_ct_contracts.py --ct-root companion-ct
      - name: Verify nodule fixture producer and receiver
        run: .venv/bin/python scripts/smoke_imaging.py --ct-root companion-ct --mode lung-fixture
      - name: Explicit setup-only download of pinned pretrained weights
        run: companion-ct/.venv/bin/python -m lung_nodule.cli fetch-model --output companion-ct/models/luna16
      - name: Verify actual pretrained CPU producer and receiver
        run: .venv/bin/python scripts/smoke_imaging.py --ct-root companion-ct --mode lung-pretrained --model-dir companion-ct/models/luna16 --device cpu
      - name: Verify retained legacy producer and receiver
        run: .venv/bin/python scripts/smoke_imaging.py --ct-root companion-ct --mode legacy
      # Generated synthetic pixels only; no Ollama, remote inference, automatic
      # review approvals, patient data or report artifact publication.


  endoscopy-workbench:
    name: Synthetic endoscopy producer-consumer smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OLLAMA_NO_CLOUD: '1'
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
    steps:
      - name: Check out LOVISA
        uses: actions/checkout@v7
      - name: Check out matching endoscopy producer
        uses: actions/checkout@v7
        with:
          repository: LilyC2024/AI-MedImg-Endo
          ref: e7ec238da9059530ede15f38399c782bdbcd262b
          path: companion-endo
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install separate local CPU environments
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock.txt
          python -m venv companion-endo/.venv
          companion-endo/.venv/bin/python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          companion-endo/.venv/bin/python -m pip install -e './companion-endo[ml]'
      - name: Check exact shared schema and worker
        run: .venv/bin/python scripts/sync_endo_contracts.py --endo-root companion-endo
      - name: Verify actual artificial fixture exchange
        run: .venv/bin/python scripts/smoke_endoscopy.py --endo-root companion-endo
      - name: Train and export a tiny artificial model
        run: |
          companion-endo/.venv/bin/python -m endo.cli synthetic-data --output companion-endo/data/ci --count 32 --size 64
          companion-endo/.venv/bin/python -m endo.cli split --data companion-endo/data/ci --output companion-endo/data/ci-split.json
          companion-endo/.venv/bin/python -m endo.cli train --data companion-endo/data/ci --manifest companion-endo/data/ci-split.json --output companion-endo/artifacts/ci-model --epochs 1 --size 64 --base 4 --threads 1 --synthetic
          companion-endo/.venv/bin/python -m endo.cli export-model --model-dir companion-endo/artifacts/ci-model
      - name: Verify actual installed-model artificial exchange
        run: .venv/bin/python scripts/smoke_endoscopy.py --endo-root companion-endo --mode installed --model-dir companion-endo/artifacts/ci-model
      # Software/inference validation only; no clinical data, Ollama, automatic
      # image acceptance, clinician approval or report publication.
