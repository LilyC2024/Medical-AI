name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      LANGCHAIN_TRACING_V2: 'false'
      LANGCHAIN_TRACING: 'false'
      LANGSMITH_TRACING: 'false'
      OLLAMA_NO_CLOUD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q medical_assistant app.py scripts tests
      - name: Run offline regression tests
        run: python -m pytest -q
      # Deliberately no Ollama download, hosted model call, record upload,
      # live-model smoke test, report artifact upload, or deployment in CI.
