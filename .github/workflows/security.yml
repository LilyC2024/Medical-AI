name: Security checks

on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install audit tools
        run: python -m pip install pip-audit==2.10.1 cyclonedx-bom==7.5.0
      - name: Audit locked dependencies for known vulnerabilities
        run: python -m pip_audit -r requirements.lock.txt --strict
      - name: Generate CycloneDX SBOM from the lockfile
        run: cyclonedx-py requirements requirements.lock.txt -o sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: lovisa-sbom
          path: sbom.cdx.json
          retention-days: 30
      # The SBOM lists package names/versions only; no records, reports or images.

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
